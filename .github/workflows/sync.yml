name: cloud-sync run

# Manually dispatched (by you, or by the dashboard's "Start sync" button via
# the GitHub API). This is the worker that actually moves bytes — the CLI runs
# here on a GitHub-hosted runner so your laptop doesn't have to stay on. Only
# cloud->cloud jobs make sense here (there's no ~/Pictures on a runner), so the
# job input is limited to gdrive-backup.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        type: choice
        options:
          - gdrive-backup
        default: gdrive-backup
      skip_verify:
        description: "Skip post-run verification"
        type: boolean
        default: false

concurrency:
  # Never run two syncs at once — they'd fight over the manifest cache.
  group: cloud-sync-${{ inputs.job }}
  cancel-in-progress: false

permissions:
  contents: write   # to commit the refreshed dashboard_data/history.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # under the 6h hard cap; a long first sync needs room
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cloud-sync
        run: pip install -e ".[dev]"

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Restore manifest cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cloud-sync
          key: manifest-v1-${{ inputs.job }}
          restore-keys: |
            manifest-v1-${{ inputs.job }}
            manifest-v1-

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Run sync
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: cloud-sync run --job "${{ inputs.job }}"

      - name: Verify
        if: ${{ inputs.skip_verify == false }}
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: cloud-sync verify --job "${{ inputs.job }}" --sample 200

      - name: Export run history for the dashboard
        run: cloud-sync export-history --out dashboard_data/history.json

      - name: Commit history snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data/history.json
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "chore: sync dashboard history [skip ci]"
            git push
          fi

      - name: Save manifest cache
        if: always()   # persist resume state even if the run failed partway
        uses: actions/cache/save@v4
        with:
          path: ~/.cloud-sync
          key: manifest-v1-${{ inputs.job }}-${{ github.run_id }}
